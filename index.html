<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Tax Planner Pro</title>

    <link rel="apple-touch-icon" href="taxes.png">
    <link rel="icon" type="image/png" href="taxes.png">
    <meta name="apple-mobile-web-app-title" content="Tax Planner Pro">
    
    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Chart.js สำหรับทำ Data Visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #0f172a; /* Slate 900 Background for Premium Feel */
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed;
            color: #334155;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        
        input[type="text"], input[type="number"], select {
            -webkit-appearance: none;
            appearance: none;
            font-size: 16px; /* ป้องกัน iOS ซูมเวลากด input */
        }

        /* Custom Scrollbar สำหรับ Modal ให้ดูพรีเมียม */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .premium-glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .input-premium {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .input-premium:focus {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.15), inset 0 0 0 2px #818cf8;
            outline: none;
            border-color: transparent;
            background-color: white;
        }

        .fade-in-up {
            animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* เล็กน้อยสำหรับ Animation ตัวเลขวิ่ง */
        .pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-6 sm:p-8 max-w-lg mx-auto mt-10 sm:mt-20 bg-white rounded-[2rem] shadow-2xl text-center fade-in-up m-4">
                            <div className="w-16 h-16 sm:w-20 sm:h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-5 sm:mb-6 shadow-inner">
                                <svg className="w-8 h-8 sm:w-10 sm:h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                            </div>
                            <h2 className="text-xl sm:text-2xl font-bold text-slate-900 mb-2 sm:mb-3">อุ๊ปส์! เกิดข้อผิดพลาด</h2>
                            <p className="text-slate-500 text-[14px] sm:text-[15px] mb-6 sm:mb-8 leading-relaxed">{this.state.error?.toString()}</p>
                            <button onClick={() => window.location.reload()} className="w-full bg-slate-900 text-white px-6 py-3.5 sm:py-4 rounded-xl sm:rounded-2xl font-bold text-base sm:text-lg hover:bg-slate-800 transition-all shadow-lg hover:shadow-xl hover:-translate-y-1">โหลดหน้าจอใหม่</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- Modern Icons ---
        const IconWallet = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>;
        const IconTarget = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const IconUsers = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconShield = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>;
        const IconCheck = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const IconHome = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>;
        const IconHeartHandshake = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08v0c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66"></path><path d="m18 15-2-2"></path><path d="m15 18-2-2"></path></svg>;
        const IconSave = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const IconFolder = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path><path d="M2 10h20"></path></svg>;
        const IconTrash = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const IconWheelchair = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="6" r="2"></circle><path d="M8 20a6 6 0 0 1-6-6c0-2.8 2-5 4.5-5.5"></path><path d="M13 10h4"></path><path d="M10 11v6"></path><path d="M15 15v5h4"></path><path d="M10 6h4l3 9"></path></svg>;
        const IconAlertCircle = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const IconBadgeCheck = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg>;
        const IconLightbulb = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>;
        const IconTrendingUp = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>;
        const IconInfo = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;

        const formatMoney = (val) => {
            if (isNaN(val) || val === undefined || val === null) return "0";
            return Math.round(val).toLocaleString('en-US');
        };

        const IncomeDonutChart = ({ totalIncome, expenses, allowances, netIncome }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current) return;

                const cExp = Math.min(expenses, totalIncome);
                const cAll = Math.min(allowances, totalIncome - cExp);
                const cNet = Math.max(0, totalIncome - cExp - cAll);

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['หักค่าใช้จ่าย', 'ค่าลดหย่อน', 'เงินได้สุทธิ'],
                        datasets: [{
                            data: [cExp, cAll, cNet],
                            backgroundColor: ['#f43f5e', '#10b981', '#6366f1'],
                            borderWidth: 0,
                            hoverOffset: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '72%',
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                titleFont: { family: 'Prompt', size: 14 },
                                bodyFont: { family: 'Prompt', size: 14 },
                                padding: 12,
                                backgroundColor: 'rgba(15, 23, 42, 0.95)',
                                titleColor: '#fff',
                                bodyColor: '#fff',
                                callbacks: {
                                    label: (context) => ` ${context.label}: ${context.raw.toLocaleString()} บาท`
                                }
                            }
                        }
                    }
                });
                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [totalIncome, expenses, allowances, netIncome]);

            if(totalIncome === 0) return null;

            return (
                <div className="bg-slate-50/70 p-5 sm:p-6 rounded-2xl border border-slate-100/50 mt-5 mb-5 fade-in-up">
                    <h4 className="text-center font-bold text-slate-800 text-[14px] sm:text-[15px] mb-4 sm:mb-5 tracking-wide">โครงสร้างรายได้ของคุณ</h4>
                    <div className="relative w-40 h-40 sm:w-48 sm:h-48 mx-auto">
                        <canvas ref={chartRef}></canvas>
                        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span className="text-[11px] sm:text-xs text-slate-500 font-semibold tracking-wider">รายได้รวม</span>
                            <span className="text-sm sm:text-base font-black text-slate-900 mt-0.5">{formatMoney(totalIncome)}</span>
                        </div>
                    </div>
                    <div className="flex flex-col space-y-3 mt-6 text-[13px] sm:text-[14px]">
                        <div className="flex justify-between items-center"><span className="flex items-center text-slate-600 font-medium"><span className="w-3 h-3 sm:w-3.5 sm:h-3.5 rounded-full bg-[#f43f5e] mr-2.5 sm:mr-3 shadow-sm"></span>หักค่าใช้จ่าย</span><span className="font-bold text-slate-800">{formatMoney(expenses)}</span></div>
                        <div className="flex justify-between items-center"><span className="flex items-center text-slate-600 font-medium"><span className="w-3 h-3 sm:w-3.5 sm:h-3.5 rounded-full bg-[#10b981] mr-2.5 sm:mr-3 shadow-sm"></span>ค่าลดหย่อน</span><span className="font-bold text-slate-800">{formatMoney(allowances)}</span></div>
                        <div className="flex justify-between items-center pt-3 mt-1 border-t border-slate-200"><span className="flex items-center font-extrabold text-indigo-900"><span className="w-3 h-3 sm:w-3.5 sm:h-3.5 rounded-full bg-[#6366f1] mr-2.5 sm:mr-3 shadow-sm"></span>เงินได้สุทธิ</span><span className="font-black text-indigo-600 text-base">{formatMoney(netIncome)}</span></div>
                    </div>
                </div>
            );
        };

        const TaxBracketBarChart = ({ bracketDetails }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current) return;
                
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }
                if(bracketDetails.length === 0) return;

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: bracketDetails.map(b => `อัตรา ${b.rate}%`),
                        datasets: [{
                            label: 'ภาษีที่ต้องเสียในขั้นนี้ (บาท)',
                            data: bracketDetails.map(b => b.tax),
                            backgroundColor: bracketDetails.map(b => b.rate === 0 ? '#10b981' : '#f43f5e'),
                            borderRadius: 6,
                            borderSkipped: false
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                titleFont: { family: 'Prompt', size: 14 },
                                bodyFont: { family: 'Prompt', size: 14 },
                                padding: 12,
                                backgroundColor: 'rgba(15, 23, 42, 0.95)',
                                callbacks: {
                                    label: (context) => ` เสียภาษี: ${context.raw.toLocaleString()} บาท`
                                }
                            }
                        },
                        scales: {
                            y: { 
                                beginAtZero: true, 
                                grid: { color: '#f1f5f9', drawBorder: false },
                                ticks: { font: { family: 'Prompt' }, padding: 10 }
                            },
                            x: { 
                                grid: { display: false, drawBorder: false },
                                ticks: { font: { family: 'Prompt', weight: 'bold' } }
                            }
                        }
                    }
                });
                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [bracketDetails]);

            if(bracketDetails.length === 0) return null;

            return <div className="w-full h-56 sm:h-64 mt-6 sm:mt-8 mb-4 fade-in-up"><canvas ref={chartRef}></canvas></div>;
        };

        const CleanCard = ({ children, className = "" }) => (
            <div className={`premium-glass-card rounded-[1.5rem] sm:rounded-[2rem] p-5 sm:p-7 md:p-9 ${className} fade-in-up`}>
                {children}
            </div>
        );

        const NumberInput = ({ label, value, onChange, maxNote, placeholder = "0", unit = "บาท", maxLength, maxValue, icon: IconComponent }) => {
            const handleChange = (e) => {
                let rawValue = e.target.value.replace(/[^0-9]/g, '');
                if (rawValue === '') { onChange(''); return; }
                let numValue = parseInt(rawValue, 10);
                if (maxValue !== undefined && numValue > maxValue) numValue = maxValue;
                onChange(numValue);
            };

            return (
                <div className="mb-5 sm:mb-7 w-full">
                    <label className="block text-[14px] sm:text-[15px] font-bold text-slate-700 mb-2 sm:mb-2.5 flex items-center">
                        {IconComponent && <IconComponent className="w-4 h-4 sm:w-5 sm:h-5 mr-2 text-indigo-500" />}
                        {label}
                    </label>
                    <div className="relative group">
                        <input
                            type="text" inputMode="numeric" maxLength={maxLength}
                            className={`w-full p-3.5 sm:p-4 input-premium rounded-xl sm:rounded-2xl text-right ${unit ? 'pr-14 sm:pr-16' : 'pr-4'} font-bold text-slate-900 text-lg sm:text-xl`}
                            value={value === '' ? '' : value.toLocaleString('en-US')}
                            onChange={handleChange} placeholder={placeholder}
                        />
                        {unit && <span className="absolute right-4 sm:right-5 top-1/2 -translate-y-1/2 text-slate-400 font-semibold text-sm sm:text-base transition-colors group-focus-within:text-indigo-500">{unit}</span>}
                    </div>
                    {maxNote && <p className="text-[12px] sm:text-[13px] font-medium text-slate-500 mt-2.5 sm:mt-3 flex items-start leading-relaxed bg-slate-50/50 border border-slate-100 p-2.5 sm:p-3 rounded-lg sm:rounded-xl">
                        <span className="mr-2 sm:mr-2.5 mt-1 sm:mt-1.5 w-1.5 h-1.5 rounded-full bg-indigo-400 block flex-shrink-0 shadow-[0_0_5px_rgba(129,140,248,0.8)]"></span> 
                        {maxNote}
                    </p>}
                </div>
            );
        };

        const App = () => {
            const STORAGE_KEY = 'taxMastery_PND90_local';

            // Local Save States
            const [savedPlans, setSavedPlans] = useState([]);
            const [planName, setPlanName] = useState('');
            const [notification, setNotification] = useState('');
            
            // Modal States
            const [showClearConfirm, setShowClearConfirm] = useState(false);
            const [showMaxSavingDetails, setShowMaxSavingDetails] = useState(false);
            const [showBreakdown, setShowBreakdown] = useState(false);
            const [showPresetConfirm, setShowPresetConfirm] = useState({ show: false, type: null });

            // Data States
            const [salary, setSalary] = useState('');
            const [bonus, setBonus] = useState('');
            const [otherIncome, setOtherIncome] = useState('');
            const [otherIncomeType, setOtherIncomeType] = useState('402');
            const [withheldTax, setWithheldTax] = useState('');
            
            const [status, setStatus] = useState('single');
            const [children, setChildren] = useState(''); 
            const [children2018, setChildren2018] = useState(''); 
            const [parents, setParents] = useState(''); 
            const [parentsHealthInsurance, setParentsHealthInsurance] = useState(''); 
            const [disabledPersons, setDisabledPersons] = useState('');

            const [socialSecurity, setSocialSecurity] = useState('');
            const [lifeInsurance, setLifeInsurance] = useState('');
            const [healthInsurance, setHealthInsurance] = useState('');
            const [providentFund, setProvidentFund] = useState('');
            const [ssf, setSsf] = useState('');
            const [rmf, setRmf] = useState('');
            const [pensionInsurance, setPensionInsurance] = useState('');
            const [tesg, setTesg] = useState('');
            
            const [mortgageInterest, setMortgageInterest] = useState('');
            const [shoppingStimulus, setShoppingStimulus] = useState('');
            const [doubleDonations, setDoubleDonations] = useState('');
            const [donations, setDonations] = useState('');

            useEffect(() => {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        setSavedPlans(JSON.parse(stored));
                    }
                } catch (e) {
                    console.error("Failed to load plans from local storage", e);
                }
            }, []);

            const showNotificationMsg = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(''), 3000);
            };

            const getFormData = () => ({
                salary, bonus, otherIncome, otherIncomeType, withheldTax, status, children, children2018, 
                parents, parentsHealthInsurance, disabledPersons, socialSecurity, lifeInsurance, healthInsurance, 
                providentFund, ssf, rmf, pensionInsurance, tesg, mortgageInterest, 
                shoppingStimulus, doubleDonations, donations
            });

            const handleClearData = () => {
                setSalary(''); setBonus(''); setOtherIncome(''); setOtherIncomeType('402'); setWithheldTax('');
                setStatus('single'); setChildren(''); setChildren2018('');
                setParents(''); setParentsHealthInsurance(''); setDisabledPersons('');
                setSocialSecurity(''); setLifeInsurance(''); setHealthInsurance('');
                setProvidentFund(''); setSsf(''); setRmf(''); setPensionInsurance('');
                setTesg(''); setMortgageInterest(''); setShoppingStimulus('');
                setDoubleDonations(''); setDonations('');
                
                setShowMaxSavingDetails(false); setShowBreakdown(false); setShowClearConfirm(false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                showNotificationMsg("🧹 ล้างข้อมูลทั้งหมดเรียบร้อยแล้ว");
            };

            const applyPreset = (type) => {
                handleClearData();
                setTimeout(() => {
                    if (type === 'office_basic') {
                        setSalary(45000); setBonus(90000); setSocialSecurity(9000); setWithheldTax(15000);
                        showNotificationMsg("โหลดโปรไฟล์: พนักงานออฟฟิศ ทั่วไป");
                    } else if (type === 'investor_max') {
                        setSalary(120000); setBonus(200000); setSocialSecurity(9000); setProvidentFund(216000);
                        setLifeInsurance(100000); setSsf(200000); setRmf(284000); setTesg(100000); setWithheldTax(100000);
                        showNotificationMsg("โหลดโปรไฟล์: สายลงทุนเต็มแม็กซ์");
                    } else if (type === 'freelance') {
                        setOtherIncomeType('402'); setOtherIncome(800000); setWithheldTax(24000);
                        setHealthInsurance(25000); setSsf(50000);
                        showNotificationMsg("โหลดโปรไฟล์: ฟรีแลนซ์ รับจ้างอิสระ");
                    }
                    setShowPresetConfirm({show: false, type: null});
                }, 100);
            };

            const handleSavePlan = (e) => {
                e.preventDefault();
                if (!planName.trim()) return showNotificationMsg("กรุณาตั้งชื่อแผนภาษี");

                try {
                    const newPlan = { id: Date.now().toString(), name: planName.trim(), data: getFormData() };
                    const updatedPlans = [newPlan, ...savedPlans];
                    setSavedPlans(updatedPlans);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedPlans));
                    setPlanName('');
                    showNotificationMsg(`บันทึกแผน "${newPlan.name}" สำเร็จ`);
                } catch (error) {
                    showNotificationMsg("เกิดข้อผิดพลาดในการบันทึก");
                }
            };

            const loadPlan = (plan) => {
                const d = plan.data || {};
                setSalary(d.salary || ''); setBonus(d.bonus || ''); setOtherIncome(d.otherIncome || ''); setOtherIncomeType(d.otherIncomeType || '402'); setWithheldTax(d.withheldTax || '');
                setStatus(d.status || 'single'); setChildren(d.children || ''); setChildren2018(d.children2018 || '');
                setParents(d.parents || ''); setParentsHealthInsurance(d.parentsHealthInsurance || ''); setDisabledPersons(d.disabledPersons || '');
                setSocialSecurity(d.socialSecurity || ''); setLifeInsurance(d.lifeInsurance || ''); setHealthInsurance(d.healthInsurance || '');
                setProvidentFund(d.providentFund || ''); setSsf(d.ssf || ''); setRmf(d.rmf || ''); setPensionInsurance(d.pensionInsurance || '');
                setTesg(d.tesg || ''); setMortgageInterest(d.mortgageInterest || ''); setShoppingStimulus(d.shoppingStimulus || '');
                setDoubleDonations(d.doubleDonations || ''); setDonations(d.donations || '');
                
                showNotificationMsg(`โหลดแผน "${plan.name}" สำเร็จ`);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const deletePlan = (id, name) => {
                const updatedPlans = savedPlans.filter(p => p.id !== id);
                setSavedPlans(updatedPlans);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(updatedPlans));
                showNotificationMsg(`ลบแผน "${name}" แล้ว`);
            };

            const calculateTaxForData = (data) => {
                const safeNum = (val) => Number(val) || 0;
                
                const salaryAnnual = safeNum(data.salary) * 12;
                const bonusValue = safeNum(data.bonus);
                const income401 = salaryAnnual + bonusValue;
                const otherIncomeValue = safeNum(data.otherIncome);
                const type = data.otherIncomeType || '402';
                
                const totalIncome = income401 + otherIncomeValue;
                
                let expenses = 0;
                let expenseBreakdownStr = "";
                
                if (type === '402') {
                    expenses = Math.min((income401 + otherIncomeValue) * 0.5, 100000);
                    expenseBreakdownStr = "หักเหมา 50% ของรายได้ทั้งหมด (สูงสุดไม่เกิน 100,000 บาท)";
                } else if (type === '408') {
                    const exp401 = Math.min(income401 * 0.5, 100000);
                    const exp408 = otherIncomeValue * 0.60;
                    expenses = exp401 + exp408;
                    expenseBreakdownStr = `เงินเดือนหักเหมา (${formatMoney(exp401)}) + ธุรกิจหักเหมา 60% (${formatMoney(exp408)})`;
                } else if (type === '405') {
                    const exp401 = Math.min(income401 * 0.5, 100000);
                    const exp405 = otherIncomeValue * 0.30;
                    expenses = exp401 + exp405;
                    expenseBreakdownStr = `เงินเดือนหักเหมา (${formatMoney(exp401)}) + ค่าเช่าหักเหมา 30% (${formatMoney(exp405)})`;
                }

                let personalAllowance = data.status === 'married_no_income' ? 120000 : 60000;
                let familyAllowance = (safeNum(data.children) * 30000) + (safeNum(data.children2018) * 60000) + 
                                      (Math.min(safeNum(data.parents), 4) * 30000) + Math.min(safeNum(data.parentsHealthInsurance), 15000) + 
                                      (safeNum(data.disabledPersons) * 60000);
                
                let socialSec = Math.min(safeNum(data.socialSecurity), 9000);
                let healthVal = Math.min(safeNum(data.healthInsurance), 25000);
                let genLifeUsed = Math.min(healthVal + safeNum(data.lifeInsurance), 100000);
                
                const pLimit = Math.min(totalIncome * 0.15, 200000);
                const actualPension = Math.min(safeNum(data.pensionInsurance), pLimit);
                let pensionExcess = safeNum(data.pensionInsurance) - actualPension;
                if (pensionExcess > 0 && genLifeUsed < 100000) {
                    genLifeUsed += Math.min(pensionExcess, 100000 - genLifeUsed);
                }
                
                const pvdActual = Math.min(safeNum(data.providentFund), income401 * 0.15, 500000);
                const ssfActual = Math.min(safeNum(data.ssf), totalIncome * 0.30, 200000);
                const rmfActual = Math.min(safeNum(data.rmf), totalIncome * 0.30, 500000);
                const retireGroup = Math.min(pvdActual + ssfActual + rmfActual + actualPension, 500000);
                
                const tesgActual = Math.min(safeNum(data.tesg), totalIncome * 0.30, 300000);
                
                let realEstateStimulus = Math.min(safeNum(data.mortgageInterest), 100000) + Math.min(safeNum(data.shoppingStimulus), 50000);

                const preDonAllowance = personalAllowance + familyAllowance + socialSec + genLifeUsed + retireGroup + tesgActual + realEstateStimulus;

                let netForDon = Math.max(0, totalIncome - expenses - preDonAllowance);

                const doubleDon = Math.min(safeNum(data.doubleDonations) * 2, netForDon * 0.10);
                let netAfterDoubleDon = netForDon - doubleDon;
                const genDon = Math.min(safeNum(data.donations), netAfterDoubleDon * 0.10);
                const totalDonationAllowance = doubleDon + genDon;

                let netIncome = Math.max(0, netAfterDoubleDon - genDon);
                const totalAllowances = preDonAllowance + doubleDon + genDon;

                const brackets = [
                    { m: 0, r: 0 }, { m: 150000, r: 0.05 }, { m: 300000, r: 0.10 }, { m: 500000, r: 0.15 },
                    { m: 750000, r: 0.20 }, { m: 1000000, r: 0.25 }, { m: 2000000, r: 0.30 }, { m: 5000000, r: 0.35 }
                ];

                let tax = 0;
                let currentBracketIndex = 0;
                let bracketDetails = [];
                
                // Next Bracket Logic
                let nextBracketGap = 0;
                let nextBracketRate = 0;

                for (let i = 0; i < brackets.length; i++) {
                    const b = brackets[i];
                    const nextM = brackets[i+1] ? brackets[i+1].m : Infinity;
                    if (netIncome > b.m) {
                        const taxableInBracket = Math.min(netIncome - b.m, nextM - b.m);
                        const taxInBracket = taxableInBracket * b.r;
                        tax += taxInBracket;
                        if (taxInBracket > 0 || b.r === 0) currentBracketIndex = i;

                        if (taxableInBracket > 0) {
                            bracketDetails.push({
                                label: b.m === 0 ? '0 - 150,000 (ยกเว้น)' : `${formatMoney(b.m + 1)} - ${nextM === Infinity ? 'ขึ้นไป' : formatMoney(nextM)}`,
                                taxable: taxableInBracket,
                                tax: taxInBracket,
                                rate: b.r * 100
                            });
                        }
                    }
                }

                // ภาษีขั้นต่ำ ม.48(2): เงินได้นอกจาก 40(1) ตั้งแต่ 120,000 บาท คิด 0.5% ของเงินได้พึงประเมิน
                // ถ้าเกิน 5,000 บาท และสูงกว่าภาษีอัตราก้าวหน้า ต้องเสียตามวิธีนี้
                const progressiveTax = tax;
                const minimumTax = otherIncomeValue >= 120000 ? otherIncomeValue * 0.005 : 0;
                const minTaxApplied = minimumTax > 5000 && minimumTax > progressiveTax;
                if (minTaxApplied) tax = minimumTax;

                // Calculate Gap to Next Bracket
                if (brackets[currentBracketIndex + 1]) {
                    nextBracketGap = brackets[currentBracketIndex + 1].m - netIncome;
                    nextBracketRate = brackets[currentBracketIndex + 1].r * 100;
                }

                const effectiveTaxRate = totalIncome > 0 ? ((tax / totalIncome) * 100).toFixed(2) : 0;

                return { 
                    tax, totalIncome, totalAllowances, netIncome, effectiveTaxRate,
                    nextBracket: { gap: nextBracketGap, rate: nextBracketRate },
                    lifeAndHealthUsed: genLifeUsed, actualTesg: tesgActual, retirementGroup: retireGroup, 
                    currentBracketRate: brackets[currentBracketIndex].r * 100,
                    totalDonationAllowance,
                    breakdown: { expenses, expenseBreakdownStr, personalAllowance, familyAllowance, socialSec, genLifeUsed, retireGroup, tesgActual, realEstateStimulus, doubleDon, genDon, bracketDetails, progressiveTax, minimumTax, minTaxApplied, wht: safeNum(data.withheldTax) }
                };
            };

            const calculation = useMemo(() => {
                const safeNum = (val) => Number(val) || 0;
                const currentData = { salary, bonus, otherIncome, otherIncomeType, withheldTax, status, children, children2018, parents, parentsHealthInsurance, disabledPersons, socialSecurity, lifeInsurance, healthInsurance, providentFund, ssf, rmf, pensionInsurance, tesg, mortgageInterest, shoppingStimulus, doubleDonations, donations };
                
                const currentCalc = calculateTaxForData(currentData);
                
                const totalIncome = currentCalc.totalIncome;
                const maxLifeAvailable = 100000 - currentCalc.lifeAndHealthUsed;
                const pvdActual = Math.min(safeNum(providentFund), (safeNum(salary) * 12 + safeNum(bonus)) * 0.15, 500000);
                const pensionActual = Math.min(safeNum(pensionInsurance), totalIncome * 0.15, 200000);
                const groupUsedBeforeNewFunds = pvdActual + pensionActual;
                let remainingRetirementCapacity = Math.max(0, 500000 - groupUsedBeforeNewFunds - safeNum(ssf) - safeNum(rmf));
                const maxRmfByIncome = totalIncome * 0.30;
                remainingRetirementCapacity = Math.min(remainingRetirementCapacity, Math.max(0, maxRmfByIncome - safeNum(rmf)));
                const maxTesgCapacity = Math.min(totalIncome * 0.30, 300000);
                const remainingTesg = Math.max(0, maxTesgCapacity - currentCalc.actualTesg);

                const maxData = { ...currentData, 
                    lifeInsurance: safeNum(currentData.lifeInsurance) + maxLifeAvailable,
                    rmf: safeNum(currentData.rmf) + remainingRetirementCapacity,
                    tesg: safeNum(currentData.tesg) + remainingTesg
                };

                const maxCalc = calculateTaxForData(maxData);
                const paidWHT = safeNum(withheldTax);
                const taxDifference = currentCalc.tax - paidWHT;

                return {
                    ...currentCalc, paidWHT, taxDifference: Math.abs(taxDifference), isRefund: taxDifference < 0,
                    lowestPossibleTax: maxCalc.tax, maxPotentialTaxSavings: currentCalc.tax - maxCalc.tax, 
                    investmentNeeded: maxLifeAvailable + remainingRetirementCapacity + remainingTesg,
                    caps: { life: maxLifeAvailable, retire: remainingRetirementCapacity, tesg: remainingTesg }
                };
            }, [salary, bonus, otherIncome, otherIncomeType, withheldTax, status, children, children2018, parents, parentsHealthInsurance, disabledPersons, socialSecurity, lifeInsurance, healthInsurance, providentFund, ssf, rmf, pensionInsurance, tesg, mortgageInterest, shoppingStimulus, doubleDonations, donations]);

            return (
                <div className="max-w-md md:max-w-[1240px] mx-auto pt-6 sm:pt-10 px-4 sm:px-5 md:px-8 space-y-6 sm:space-y-10 relative pb-28 xl:pb-0">
                    
                    {/* Notifications & Modals */}
                    {notification && (
                        <div className="fixed top-4 sm:top-8 right-4 sm:right-8 z-[300] bg-slate-900/90 backdrop-blur-xl border border-white/10 text-white px-5 sm:px-7 py-3 sm:py-4 rounded-xl sm:rounded-2xl shadow-2xl flex items-center fade-in-up">
                            <div className="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-emerald-500/20 flex items-center justify-center mr-3 sm:mr-4">
                                <IconCheck className="w-4 h-4 sm:w-5 sm:h-5 text-emerald-400" />
                            </div>
                            <span className="font-semibold text-xs sm:text-sm tracking-wide">{notification}</span>
                        </div>
                    )}

                    {showPresetConfirm.show && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[250] flex items-center justify-center p-4 fade-in-up">
                            <div className="bg-white rounded-[2rem] sm:rounded-[2.5rem] p-6 sm:p-8 md:p-10 max-w-sm w-full shadow-2xl border border-white/20">
                                <div className="w-16 h-16 sm:w-20 sm:h-20 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-5 sm:mb-6 shadow-inner">
                                    <IconLightbulb className="w-8 h-8 sm:w-10 sm:h-10" />
                                </div>
                                <h3 className="text-xl sm:text-2xl font-bold text-center text-slate-900 mb-2 sm:mb-3">เขียนทับข้อมูลเดิม?</h3>
                                <p className="text-center text-slate-500 text-[14px] sm:text-[15px] mb-6 sm:mb-8 leading-relaxed">
                                    การโหลดโปรไฟล์จำลองจะ <strong>ล้างข้อมูลปัจจุบัน</strong> และแทนที่ด้วยข้อมูลใหม่ทั้งหมด
                                </p>
                                <div className="flex gap-3 sm:gap-4">
                                    <button onClick={() => setShowPresetConfirm({show: false, type: null})} className="flex-1 py-3 sm:py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl sm:rounded-2xl font-bold transition-all">ยกเลิก</button>
                                    <button onClick={() => applyPreset(showPresetConfirm.type)} className="flex-1 py-3 sm:py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl sm:rounded-2xl font-bold transition-all shadow-lg shadow-indigo-600/30">ดำเนินการ</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showClearConfirm && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[250] flex items-center justify-center p-4 fade-in-up">
                            <div className="bg-white rounded-[2rem] sm:rounded-[2.5rem] p-6 sm:p-8 md:p-10 max-w-sm w-full shadow-2xl border border-white/20">
                                <div className="w-16 h-16 sm:w-20 sm:h-20 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-5 sm:mb-6 shadow-inner">
                                    <IconTrash className="w-8 h-8 sm:w-10 sm:h-10" />
                                </div>
                                <h3 className="text-xl sm:text-2xl font-bold text-center text-slate-900 mb-2 sm:mb-3">ยืนยันการล้างข้อมูล?</h3>
                                <p className="text-center text-slate-500 text-[14px] sm:text-[15px] mb-6 sm:mb-8 leading-relaxed">ข้อมูลที่คุณกรอกจะถูกลบทั้งหมด (แผนที่บันทึกไว้จะไม่หายไป)</p>
                                <div className="flex gap-3 sm:gap-4">
                                    <button onClick={() => setShowClearConfirm(false)} className="flex-1 py-3 sm:py-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl sm:rounded-2xl font-bold transition-all">ยกเลิก</button>
                                    <button onClick={handleClearData} className="flex-1 py-3 sm:py-4 bg-rose-600 hover:bg-rose-700 text-white rounded-xl sm:rounded-2xl font-bold transition-all shadow-lg shadow-rose-600/30">ล้างข้อมูล</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Premium Header */}
                    <div className="premium-glass-card rounded-[1.5rem] sm:rounded-[2.5rem] p-5 sm:p-8 flex flex-col md:flex-row items-center justify-between z-40 relative">
                        <div className="flex items-center flex-col md:flex-row text-center md:text-left">
                            <div className="bg-gradient-to-br from-indigo-500 to-blue-600 text-white p-3 sm:p-4 rounded-2xl sm:rounded-3xl md:mr-6 shadow-lg shadow-indigo-500/30 mb-3 sm:mb-4 md:mb-0 transform transition-transform hover:scale-105">
                                <IconWallet className="w-8 h-8 sm:w-10 sm:h-10" />
                            </div>
                            <div>
                                <h1 className="text-2xl sm:text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-900 to-slate-700 tracking-tight">Tax Planner Pro</h1>
                                <p className="text-slate-500 text-[13px] sm:text-[15px] mt-1 sm:mt-2 font-medium flex items-center justify-center md:justify-start">
                                    <IconBadgeCheck className="w-4 h-4 sm:w-5 sm:h-5 mr-1.5 text-emerald-500" /> เครื่องมือวางแผนภาษีอัจฉริยะ (อัปเดต ภ.ง.ด.90)
                                </p>
                            </div>
                        </div>
                        <button onClick={() => setShowClearConfirm(true)} className="mt-4 sm:mt-6 md:mt-0 flex items-center text-xs sm:text-sm font-bold text-slate-500 bg-white hover:bg-rose-50 hover:text-rose-600 px-4 sm:px-6 py-2.5 sm:py-3 rounded-xl sm:rounded-2xl border border-slate-200 hover:border-rose-200 transition-all shadow-sm">
                            <IconTrash className="w-3 h-3 sm:w-4 sm:h-4 mr-1.5 sm:mr-2" /> ล้างฟอร์ม
                        </button>
                    </div>

                    {}
                    {/* Smart Presets */}
                    <div className="flex flex-wrap gap-2 sm:gap-3 z-40 relative">
                        <span className="w-full sm:w-auto text-[13px] sm:text-[14px] font-bold text-slate-400/80 uppercase tracking-widest flex items-center mb-1 sm:mb-0 sm:mr-2">
                            <IconLightbulb className="w-4 h-4 mr-1.5" /> จำลองโปรไฟล์:
                        </span>
                        <button onClick={() => setShowPresetConfirm({show: true, type: 'office_basic'})} className="px-3 sm:px-4 py-2 bg-indigo-50/80 hover:bg-indigo-100 text-indigo-700 rounded-lg sm:rounded-xl text-xs sm:text-sm font-semibold transition-all border border-indigo-100/50 backdrop-blur-sm">🏢 พนักงานออฟฟิศ</button>
                        <button onClick={() => setShowPresetConfirm({show: true, type: 'investor_max'})} className="px-3 sm:px-4 py-2 bg-emerald-50/80 hover:bg-emerald-100 text-emerald-700 rounded-lg sm:rounded-xl text-xs sm:text-sm font-semibold transition-all border border-emerald-100/50 backdrop-blur-sm">📈 สายลงทุนเต็มแม็กซ์</button>
                        <button onClick={() => setShowPresetConfirm({show: true, type: 'freelance'})} className="px-3 sm:px-4 py-2 bg-amber-50/80 hover:bg-amber-100 text-amber-700 rounded-lg sm:rounded-xl text-xs sm:text-sm font-semibold transition-all border border-amber-100/50 backdrop-blur-sm">💻 ฟรีแลนซ์ 40(2)</button>
                    </div>

                    <div className="grid grid-cols-1 xl:grid-cols-12 gap-6 sm:gap-8 xl:gap-10 items-start">
                        
                        {/* LEFT COLUMN: Inputs */}
                        <div className="xl:col-span-7 space-y-6 sm:space-y-8 z-30">
                            
                            {/* 1. Income */}
                            <CleanCard>
                                <h2 className="text-lg sm:text-xl font-extrabold mb-5 sm:mb-7 text-slate-800 flex items-center pb-4 border-b border-slate-100/80 tracking-tight">
                                    <span className="bg-gradient-to-br from-blue-100 to-blue-50 text-blue-600 p-2 sm:p-2.5 rounded-xl sm:rounded-2xl mr-3 sm:mr-4 shadow-sm border border-blue-100"><IconWallet className="w-5 h-5 sm:w-6 h-6" /></span>
                                    1. หมวดรายได้ (เงินได้พึงประเมิน)
                                </h2>
                                
                                <div className="bg-slate-50/50 p-5 sm:p-6 rounded-2xl sm:rounded-[1.5rem] border border-slate-100 mb-5 sm:mb-6">
                                    <h3 className="font-extrabold text-slate-700 mb-4 sm:mb-5 text-xs sm:text-sm uppercase tracking-widest flex items-center"><span className="w-2 h-2 rounded-full bg-blue-500 mr-2"></span>รายได้จากงานประจำ 40(1)</h3>
                                    <NumberInput label="เงินเดือน (ยอดต่อเดือน)" value={salary} onChange={setSalary} maxNote="ระบบจะนำไปคูณ 12 เดือนให้อัตโนมัติ" />
                                    <NumberInput label="โบนัส (ยอดรวมทั้งปี)" value={bonus} onChange={setBonus} />
                                </div>

                                <div className="bg-slate-50/50 p-5 sm:p-6 rounded-2xl sm:rounded-[1.5rem] border border-slate-100 mb-5 sm:mb-6">
                                    <h3 className="font-extrabold text-slate-700 mb-4 sm:mb-5 text-xs sm:text-sm uppercase tracking-widest flex items-center"><span className="w-2 h-2 rounded-full bg-amber-500 mr-2"></span>รายได้อื่นๆ (ภ.ง.ด.90)</h3>
                                    <div className="mb-5 sm:mb-6">
                                        <label className="block text-[14px] sm:text-[15px] font-bold text-slate-700 mb-2 sm:mb-2.5">ประเภทของรายได้อื่นๆ</label>
                                        <div className="relative group">
                                            <select className="w-full p-3.5 sm:p-4 input-premium rounded-xl sm:rounded-2xl font-bold text-slate-800 appearance-none cursor-pointer text-sm sm:text-base" value={otherIncomeType} onChange={(e) => setOtherIncomeType(e.target.value)}>

                                    <div>
                                        <h3 className="font-extrabold text-emerald-950 text-base sm:text-lg tracking-tight">เป้าหมายประหยัดภาษีสูงสุด</h3>
                                        <p className="text-[12px] sm:text-[13px] text-emerald-700/80 font-semibold">จำลองแผนหากคุณซื้อลดหย่อนเต็มเพดาน</p>
                                    </div>
                                </div>
                                
                                <div className="bg-white p-5 sm:p-6 rounded-xl sm:rounded-2xl border border-emerald-100 shadow-[0_4px_20px_-5px_rgba(16,185,129,0.15)]">
                                    <p className="text-[13px] sm:text-[14px] text-slate-500 mb-1 font-bold uppercase tracking-widest">ภาษีต่ำสุดที่คุณทำได้ (Best Case)</p>
                                    <p className="text-[2rem] sm:text-[2.5rem] font-black text-emerald-600 mb-4 sm:mb-6 leading-none mt-2 drop-shadow-sm">{formatMoney(calculation.lowestPossibleTax)} <span className="text-sm sm:text-base text-emerald-600/70 font-bold ml-1">บาท</span></p>
                                    
                                    {calculation.tax > 0 && calculation.investmentNeeded > 0 ? (
                                        <>
                                            <div className="flex justify-between text-[11px] sm:text-xs font-extrabold mb-2.5">
                                                <span className="text-slate-500 uppercase">ประหยัดภาษีได้อีก</span>
                                                <span className="text-emerald-500 text-[13px] sm:text-sm">{formatMoney(calculation.maxPotentialTaxSavings)} บาท</span>
                                            </div>
                                            <div className="w-full h-3 sm:h-4 bg-slate-100 rounded-full overflow-hidden flex mb-2 shadow-inner">
                                                <div className="bg-emerald-400 h-full transition-all duration-1000" style={{ width: `${(calculation.lowestPossibleTax / calculation.tax) * 100}%` }}></div>
                                                <div className="bg-indigo-300 h-full transition-all duration-1000" style={{ width: `${(calculation.maxPotentialTaxSavings / calculation.tax) * 100}%` }}></div>
                                            </div>
                                            
                                            <button onClick={() => setShowMaxSavingDetails(!showMaxSavingDetails)} className="mt-5 sm:mt-6 w-full bg-slate-50 hover:bg-slate-100 border border-slate-200 py-3 sm:py-3.5 rounded-xl sm:rounded-2xl text-xs sm:text-sm font-bold text-slate-700 transition-colors">
                                                {showMaxSavingDetails ? 'ซ่อนรายละเอียดโควตา' : 'ดูโควตาการลงทุนที่สามารถซื้อเพิ่มได้'}
                                            </button>

                                            {showMaxSavingDetails && (
                                                <div className="mt-4 sm:mt-5 space-y-2 sm:space-y-2.5 fade-in-up">
                                                    <p className="text-[11px] sm:text-xs font-bold text-slate-400 mb-2 sm:mb-3 text-center uppercase tracking-widest">สิทธิลดหย่อนที่ยังว่างอยู่</p>
                                                    {calculation.caps.life > 0 && (
                                                        <div className="bg-white border border-slate-100 p-3 sm:p-4 rounded-xl flex justify-between items-center text-[14px] sm:text-[15px] shadow-sm">
                                                            <span className="flex items-center text-slate-600 font-bold"><span className="w-2.5 h-2.5 rounded-full bg-blue-400 mr-2.5 sm:mr-3 shadow-sm"></span>ประกันชีวิต/สุขภาพ</span>
                                                            <span className="font-black text-slate-800">{formatMoney(calculation.caps.life)}</span>
                                                        </div>
                                                    )}
                                                    {calculation.caps.retire > 0 && (
                                                        <div className="bg-white border border-slate-100 p-3 sm:p-4 rounded-xl flex justify-between items-center text-[14px] sm:text-[15px] shadow-sm">
                                                            <span className="flex items-center text-slate-600 font-bold"><span className="w-2.5 h-2.5 rounded-full bg-teal-400 mr-2.5 sm:mr-3 shadow-sm"></span>เกษียณ (RMF/SSF/PVD)</span>
                                                            <span className="font-black text-slate-800">{formatMoney(calculation.caps.retire)}</span>
                                                        </div>
                                                    )}
                                                    {calculation.caps.tesg > 0 && (
                                                        <div className="bg-white border border-slate-100 p-3 sm:p-4 rounded-xl flex justify-between items-center text-[14px] sm:text-[15px] shadow-sm">
                                                            <span className="flex items-center text-slate-600 font-bold"><span className="w-2.5 h-2.5 rounded-full bg-orange-400 mr-2.5 sm:mr-3 shadow-sm"></span>กองทุน Thai ESG</span>
                                                            <span className="font-black text-slate-800">{formatMoney(calculation.caps.tesg)}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </>
                                    ) : (
                                        <div className="text-[14px] sm:text-[15px] font-extrabold text-emerald-600 bg-emerald-50/80 p-4 sm:p-5 rounded-xl sm:rounded-2xl text-center border border-emerald-100/50 shadow-sm">
                                            ยอดเยี่ยมมาก! 👏 คุณบริหารภาษีได้ถึงจุดต่ำสุดแล้ว
                                        </div>
                                    )}
                                </div>
                            </CleanCard>

                        </div>
                    </div>

                    {}
                    {/* Breakdown Modal */}
                    {showBreakdown && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[200] flex items-end sm:items-center justify-center sm:p-6 fade-in-up">
                            <div className="bg-white rounded-t-[2rem] sm:rounded-t-[2.5rem] sm:rounded-[2.5rem] p-5 sm:p-6 md:p-10 w-full max-w-3xl max-h-[90vh] overflow-y-auto shadow-2xl relative border border-white/20">
                                <button onClick={() => setShowBreakdown(false)} className="absolute top-4 sm:top-6 right-4 sm:right-6 p-2 sm:p-2.5 bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-800 rounded-full transition-all">
                                    <svg className="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                                </button>
                                
                                <h3 className="text-xl sm:text-2xl md:text-3xl font-extrabold text-slate-900 mb-6 sm:mb-8 flex items-center pr-10">
                                    <div className="bg-indigo-100 p-2 sm:p-3 rounded-xl sm:rounded-2xl text-indigo-600 mr-3 sm:mr-4 shadow-inner flex-shrink-0"><svg className="w-5 h-5 sm:w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
                                    รายละเอียดการคำนวณภาษี
                                </h3>

                                <div className="space-y-6">
                                    {/* Step 1 & 2 */}
                                    <div className="bg-slate-50/80 rounded-2xl sm:rounded-3xl p-5 sm:p-6 border border-slate-200/60 shadow-sm">
                                        <div className="flex justify-between font-extrabold text-slate-800 mb-3 sm:mb-4 text-sm sm:text-base">
                                            <span>1. เงินได้พึงประเมินทั้งหมด</span>
                                            <span>{formatMoney(calculation.totalIncome)}</span>
                                        </div>
                                        <div className="flex justify-between font-extrabold text-rose-500 text-[14px] sm:text-[15px] mb-2">
                                            <span>2. หัก ค่าใช้จ่ายตามประเภทรายได้</span>
                                            <span>-{formatMoney(calculation.breakdown.expenses)}</span>
                                        </div>
                                        <div className="text-xs sm:text-sm text-slate-500 ml-4 font-semibold">
                                            ↳ {calculation.breakdown.expenseBreakdownStr}
                                        </div>
                                    </div>

                                    {/* Step 3: Allowances */}
                                    <div className="bg-slate-50/80 rounded-2xl sm:rounded-3xl p-5 sm:p-6 border border-slate-200/60 shadow-sm">
                                        <div className="font-extrabold text-slate-800 mb-4 sm:mb-5 text-sm sm:text-base">3. หัก ค่าลดหย่อนต่างๆ</div>
                                        <div className="space-y-2.5 sm:space-y-3 text-[14px] sm:text-[15px] text-slate-600 ml-1 sm:ml-3">
                                            {calculation.breakdown.personalAllowance > 0 && <div className="flex justify-between font-medium"><span>- ลดหย่อนส่วนตัว/สมรส</span><span className="font-bold text-rose-500">-{formatMoney(calculation.breakdown.personalAllowance)}</span></div>}
                                            {calculation.breakdown.familyAllowance > 0 && <div className="flex justify-between font-medium"><span>- บุตรและบิดามารดา</span><span className="font-bold text-rose-500">-{formatMoney(calculation.breakdown.familyAllowance)}</span></div>}
                                            {calculation.breakdown.socialSec > 0 && <div className="flex justify-between font-medium"><span>- ประกันสังคม</span><span className="font-bold text-rose-500">-{formatMoney(calculation.breakdown.socialSec)}</span></div>}
                                            {calculation.breakdown.genLifeUsed > 0 && <div className="flex justify-between font-medium"><span>- ประกันชีวิต/สุขภาพ</span><span className="font-bold text-rose-500">-{formatMoney(calculation.breakdown.genLifeUsed)}</span></div>}
                                            {calculation.breakdown.retireGroup > 0 && <div className="flex justify-between font-medium"><span>- กลุ่มเกษียณ (PVD/SSF/RMF/บำนาญ)</span><span className="font-bold text-rose-500">-{formatMoney(calculation.breakdown.retireGroup)}</span></div>}
                                            {calculation.breakdown.tesgActual > 0 && <div className="flex justify-between font-medium"><span>- กองทุน Thai ESG</span><span className="font-bold text-rose-500">-{formatMoney(calculation.breakdown.tesgActual)}</span></div>}
                                            {calculation.breakdown.realEstateStimulus > 0 && <div className="flex justify-between font-medium"><span>- ดอกเบี้ยบ้าน / มาตรการรัฐ</span><span className="font-bold text-rose-500">-{formatMoney(calculation.breakdown.realEstateStimulus)}</span></div>}
                                            {calculation.breakdown.doubleDon > 0 && <div className="flex justify-between font-medium"><span>- บริจาคการศึกษา/รพ. (x2)</span><span className="font-bold text-rose-500">-{formatMoney(calculation.breakdown.doubleDon)}</span></div>}
                                            {calculation.breakdown.genDon > 0 && <div className="flex justify-between font-medium"><span>- บริจาคทั่วไป</span><span className="font-bold text-rose-500">-{formatMoney(calculation.breakdown.genDon)}</span></div>}
                                        </div>
                                        <div className="flex justify-between font-extrabold text-slate-800 mt-5 sm:mt-6 pt-4 sm:pt-5 border-t border-slate-200 text-sm sm:text-base">
                                            <span>รวมค่าลดหย่อนทั้งหมด</span>
                                            <span className="text-rose-500">-{formatMoney(calculation.totalAllowances)}</span>
                                        </div>
                                    </div>

                                    {/* Step 4: Net Income */}
                                    <div className="bg-indigo-50/80 rounded-2xl sm:rounded-3xl p-5 sm:p-6 border border-indigo-100 shadow-sm flex flex-col sm:flex-row sm:justify-between sm:items-center">
                                        <span className="font-extrabold text-indigo-950 text-sm sm:text-base mb-2 sm:mb-0">4. เงินได้สุทธิ (คำนวณภาษี)</span>
                                        <span className="font-black text-2xl sm:text-3xl text-indigo-600">{formatMoney(calculation.netIncome)}</span>
                                    </div>

                                    {/* Step 5: Tax Bracket Table & Bar Chart */}
                                    <div className="bg-white rounded-2xl sm:rounded-3xl border border-slate-200/80 overflow-hidden shadow-sm">
                                        <div className="bg-slate-50 p-4 sm:p-5 font-extrabold text-slate-800 text-sm sm:text-base border-b border-slate-100">
                                            5. คำนวณภาษีตามขั้นบันได
                                        </div>
                                        
                                        <div className="px-3 sm:px-5">
                                            <TaxBracketBarChart bracketDetails={calculation.breakdown.bracketDetails} />
                                        </div>

                                        <div className="p-0 overflow-x-auto border-t border-slate-100">
                                            <table className="w-full text-[13px] sm:text-[14px] text-left text-slate-600 min-w-[400px]">
                                                <thead className="bg-slate-50 text-[11px] sm:text-[12px] uppercase tracking-wider border-b border-slate-200 font-extrabold text-slate-500">
                                                    <tr>
                                                        <th className="px-4 py-3 sm:py-4 text-center w-24">อัตรา</th>
                                                        <th className="px-4 py-3 sm:py-4">ขั้นเงินได้สุทธิ (บาท)</th>
                                                        <th className="px-4 py-3 sm:py-4 text-right">ภาษีในขั้น</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {calculation.breakdown.bracketDetails.length > 0 ? calculation.breakdown.bracketDetails.map((b, idx) => (
                                                        <tr key={idx} className="border-b border-slate-50 last:border-0 hover:bg-slate-50/50 transition-colors">
                                                            <td className="px-4 py-3 sm:py-4 text-center font-black text-slate-700 bg-slate-50/30">{b.rate}%</td>
                                                            <td className="px-4 py-3 sm:py-4 font-semibold">{b.label}</td>
                                                            <td className={`px-4 py-3 sm:py-4 text-right font-bold ${b.rate > 0 ? 'text-rose-500' : 'text-emerald-500'}`}>{formatMoney(b.tax)}</td>
                                                        </tr>
                                                    )) : (
                                                        <tr><td colSpan="3" className="px-4 py-6 text-center text-slate-400 font-semibold">ไม่มีภาษีที่ต้องเสีย</td></tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    {/* Step 6: Final Calculation */}
                                    <div className="bg-slate-900 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden mt-6 sm:mt-8">
                                        <div className="absolute top-0 right-0 w-32 h-32 sm:w-48 sm:h-48 bg-indigo-500/20 blur-[40px] sm:blur-[50px] rounded-full"></div>
                                        <div className="relative z-10 space-y-3 sm:space-y-4">
                                            {calculation.breakdown.minTaxApplied && (
                                                <div className="text-amber-300 text-xs sm:text-sm font-semibold leading-relaxed">
                                                    ⚠️ ใช้ภาษีขั้นต่ำ 0.5% ของเงินได้นอกจาก 40(1) ({formatMoney(calculation.breakdown.minimumTax)}) เพราะสูงกว่าภาษีอัตราก้าวหน้า ({formatMoney(calculation.breakdown.progressiveTax)}) ตาม ม.48(2)
                                                </div>
                                            )}
                                            <div className="flex justify-between text-white/80 font-bold text-sm sm:text-base">
                                                <span>ภาษีที่คำนวณได้รวมทั้งสิ้น</span>
                                                <span>{formatMoney(calculation.tax)}</span>
                                            </div>
                                            <div className="flex justify-between text-indigo-300 font-bold text-sm sm:text-base border-b border-white/10 pb-4 sm:pb-5">
                                                <span>หัก ภาษีนำส่งแล้ว (ณ ที่จ่าย)</span>
                                                <span>-{formatMoney(calculation.breakdown.wht)}</span>
                                            </div>
                                            <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center text-white pt-3 sm:pt-4">
                                                <span className="font-extrabold text-base sm:text-lg mb-1.5 sm:mb-0">{calculation.tax - calculation.breakdown.wht < 0 ? '🎉 ยินดีด้วย คุณได้เงินคืน' : '⚠️ ภาษีสุทธิที่ต้องชำระเพิ่ม'}</span>
                                                <span className={`font-black text-3xl sm:text-4xl ${calculation.tax - calculation.breakdown.wht < 0 ? 'text-emerald-400' : 'text-amber-400'}`}>{formatMoney(Math.abs(calculation.tax - calculation.breakdown.wht))}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <button onClick={() => setShowBreakdown(false)} className="mt-6 sm:mt-10 w-full py-3.5 sm:py-4 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl sm:rounded-2xl font-black text-base sm:text-lg transition-all">
                                    ปิดหน้าต่าง
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Mobile Floating Action Bar (Sticky Bottom) */}
                    <div className="xl:hidden fixed bottom-4 left-4 right-4 z-40 fade-in-up pointer-events-none">
                        <div className="premium-glass-card rounded-2xl p-4 flex items-center justify-between shadow-[0_10px_40px_rgba(0,0,0,0.15)] pointer-events-auto border-indigo-500/20 bg-white/95 backdrop-blur-xl">
                            <div className="flex flex-col">
                                <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-0.5">{calculation.isRefund ? 'ได้รับเงินคืน' : 'ยอดภาษีสุทธิ'}</span>
                                <span className={`text-xl font-black leading-none ${calculation.isRefund ? 'text-emerald-500' : (calculation.taxDifference > 0 ? 'text-rose-500' : 'text-slate-800')}`}>
                                    {formatMoney(calculation.taxDifference)} <span className="text-xs font-bold text-slate-400">บาท</span>
                                </span>
                            </div>
                            <button 
                                onClick={() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' })} 
                                className="bg-slate-900 text-white px-5 py-2.5 rounded-xl text-[13px] font-bold shadow-md hover:bg-slate-800 active:scale-95 transition-all"
                            >
                                ดูสรุปผล
                            </button>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
