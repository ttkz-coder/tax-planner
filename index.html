<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tax Planner 3D</title>
    <meta name="description" content="วางแผนภาษีเงินได้บุคคลธรรมดา ภ.ง.ด.90/91 พร้อมภาพ 3 มิติ">
    <meta name="theme-color" content="#020617">

    <link rel="apple-touch-icon" href="taxes.png">
    <link rel="icon" type="image/png" href="taxes.png">
    <meta name="apple-mobile-web-app-title" content="Tax Planner 3D">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com/3.4.5"></script>
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="tax-engine.js"></script>

    <style>
        :root { color-scheme: dark; }
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #020617;
            color: #e2e8f0;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
        .aurora::before, .aurora::after {
            content: ''; position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
            filter: blur(90px); opacity: .35; animation: drift 24s ease-in-out infinite alternate;
        }
        .aurora::before { background: radial-gradient(circle, #4f46e5 0, transparent 65%); top: -30vmax; left: -20vmax; }
        .aurora::after { background: radial-gradient(circle, #0d9488 0, transparent 65%); bottom: -35vmax; right: -25vmax; animation-delay: -12s; }
        @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.1); } }

        input[type="text"], select { -webkit-appearance: none; appearance: none; font-size: 16px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .glass {
            background: linear-gradient(160deg, rgba(30,41,59,.72), rgba(15,23,42,.72));
            border: 1px solid rgba(148,163,184,.14);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 20px 50px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
        }
        .field {
            background: rgba(2,6,23,.55);
            border: 1px solid rgba(148,163,184,.18);
            color: #f8fafc;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }
        .field:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 4px rgba(99,102,241,.18); background: rgba(2,6,23,.8); }
        .field::placeholder { color: #475569; }
        select.field option { background: #0f172a; }

        .fade-in-up { animation: fadeInUp .5s cubic-bezier(.16,1,.3,1) both; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

        .scene-wrap { touch-action: pan-y; cursor: grab; }
        .scene-wrap:active { cursor: grabbing; }
        .scene-wrap canvas { display: block; width: 100% !important; height: 100% !important; }

        @media (prefers-reduced-motion: reduce) {
            .aurora::before, .aurora::after, .fade-in-up { animation: none; }
        }
    </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white">
    <div class="aurora"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef, useCallback } = React;
        const TE = window.TaxEngine;

        // ================= Utils =================
        const fmt = (v) => (Number.isFinite(v) ? Math.round(v) : 0).toLocaleString('en-US');
        const fmtShort = (v) => {
            if (v >= 1e6) return `${+(v / 1e6).toFixed(v % 1e6 ? 2 : 0)}M`;
            if (v >= 1e3) return `${+(v / 1e3).toFixed(0)}K`;
            return `${Math.round(v)}`;
        };
        const pct = (v, d = 2) => `${(Number.isFinite(v) ? v : 0).toFixed(d)}%`;
        const RATE_COLORS = ['#10b981', '#22c55e', '#84cc16', '#eab308', '#f59e0b', '#f97316', '#ef4444', '#e11d48'];

        class ErrorBoundary extends React.Component {
            constructor(p) { super(p); this.state = { error: null }; }
            static getDerivedStateFromError(error) { return { error }; }
            render() {
                if (!this.state.error) return this.props.children;
                return (
                    <div className="glass max-w-lg mx-auto mt-20 m-4 p-8 rounded-3xl text-center">
                        <h2 className="text-2xl font-bold text-white mb-3">อุ๊ปส์! เกิดข้อผิดพลาด</h2>
                        <p className="text-slate-400 mb-6">{String(this.state.error)}</p>
                        <button onClick={() => location.reload()} className="w-full bg-indigo-600 text-white py-3 rounded-2xl font-bold">โหลดใหม่</button>
                    </div>
                );
            }
        }

        // ================= Icons =================
        const Svg = ({ className, children, sw = 2 }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
        const IconWallet = (p) => <Svg {...p}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></Svg>;
        const IconUsers = (p) => <Svg {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Svg>;
        const IconShield = (p) => <Svg {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></Svg>;
        const IconSprout = (p) => <Svg {...p}><path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/></Svg>;
        const IconPiggy = (p) => <Svg {...p}><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/><path d="M16 11h.01"/></Svg>;
        const IconHome = (p) => <Svg {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Svg>;
        const IconHeart = (p) => <Svg {...p}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></Svg>;
        const IconTrash = (p) => <Svg {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></Svg>;
        const IconTarget = (p) => <Svg {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Svg>;
        const IconAlert = (p) => <Svg {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Svg>;
        const IconCheck = (p) => <Svg {...p} sw={2.5}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Svg>;
        const IconSave = (p) => <Svg {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></Svg>;
        const IconDoc = (p) => <Svg {...p}><path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5.586a1 1 0 0 1 .707.293l5.414 5.414a1 1 0 0 1 .293.707V19a2 2 0 0 1-2 2z"/></Svg>;
        const IconCalendar = (p) => <Svg {...p}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></Svg>;
        const IconCube = (p) => <Svg {...p}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></Svg>;
        const IconX = (p) => <Svg {...p} sw={2.5}><path d="M6 18 18 6M6 6l12 12"/></Svg>;
        const IconSpark = (p) => <Svg {...p}><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1M5.6 18.4l2.1-2.1m8.6-8.6 2.1-2.1"/></Svg>;

        // ================= 3D Scene =================
        function makeLabel(text, { color = '#f8fafc', size = 0.42, weight = 600, bg = null } = {}) {
            const px = 64, pad = bg ? 22 : 6;
            const c = document.createElement('canvas');
            const g = c.getContext('2d');
            g.font = `${weight} ${px}px Prompt, sans-serif`;
            const w = Math.ceil(g.measureText(text).width) + pad * 2;
            c.width = w; c.height = px * 1.5;
            g.font = `${weight} ${px}px Prompt, sans-serif`;
            if (bg) {
                g.fillStyle = bg;
                const r = c.height / 2;
                g.beginPath(); g.moveTo(r, 0); g.arcTo(w, 0, w, c.height, r); g.arcTo(w, c.height, 0, c.height, r); g.arcTo(0, c.height, 0, 0, r); g.arcTo(0, 0, w, 0, r); g.fill();
            }
            g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText(text, w / 2, c.height / 2 + 3);
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.anisotropy = 4;
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
            const s = new THREE.Sprite(mat);
            s.scale.set(size * (w / c.height), size, 1);
            s.renderOrder = 10;
            return s;
        }

        // ให้ object "งอก" ขึ้นมาตามแกนที่กำหนด
        const grow = (obj, axis = 'y', delay = 0) => { obj.userData.grow = { axis, t: -delay }; obj.scale[axis] = 0.001; return obj; };

        function buildStairs(group, calc) {
            const W = 1.55, GAP = 0.18, D = 2.4;
            const n = TE.BRACKETS.length;
            const total = n * W + (n - 1) * GAP;
            const x0 = -total / 2;
            const idx = calc.brackets.reduce((acc, b) => (b.taxable > 0 ? b.index : acc), 0);
            let marker = null;

            calc.brackets.forEach((b, i) => {
                const h = 0.35 + b.rate * 0.15;
                const left = x0 + i * (W + GAP);
                const color = new THREE.Color(RATE_COLORS[i]);

                // โครงขั้นบันได (โปร่ง)
                const ghostGeo = new THREE.BoxGeometry(W, h, D);
                ghostGeo.translate(0, h / 2, 0);
                const ghost = new THREE.Mesh(ghostGeo, new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.08, roughness: 0.4, depthWrite: false }));
                ghost.position.x = left + W / 2;
                group.add(ghost);
                const edges = new THREE.LineSegments(new THREE.EdgesGeometry(ghostGeo), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.45 }));
                edges.position.copy(ghost.position);
                group.add(edges);

                // ส่วนที่เงินได้สุทธิเข้ามาอยู่ในขั้นนี้
                const span = Number.isFinite(b.max) ? b.max - b.min : 5000000;
                const f = Math.min(1, b.taxable / span);
                if (f > 0) {
                    const fw = Math.max(0.04, W * f);
                    const geo = new THREE.BoxGeometry(fw, h, D * 0.86);
                    geo.translate(fw / 2, h / 2, 0);
                    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: i === idx ? 0.55 : 0.25, roughness: 0.25, metalness: 0.35 }));
                    m.position.x = left;
                    group.add(grow(m, 'y', i * 0.07));
                    if (b.tax > 0) {
                        const tl = makeLabel(`฿${fmt(b.tax)}`, { size: 0.36, color: '#fff', bg: 'rgba(2,6,23,.75)' });
                        tl.position.set(left + W / 2, h + 0.95, 0);
                        group.add(tl);
                    }
                    if (i === idx) marker = { x: left + fw, h };
                }

                const rl = makeLabel(`${b.rate}%`, { size: 0.5, color: RATE_COLORS[i], weight: 800 });
                rl.position.set(left + W / 2, h + 0.45, 0);
                group.add(rl);
                const range = Number.isFinite(b.max) ? `${fmtShort(b.min)}–${fmtShort(b.max)}` : `${fmtShort(b.min)}+`;
                const bl = makeLabel(range, { size: 0.3, color: '#94a3b8', weight: 500 });
                bl.position.set(left + W / 2, -0.3, D / 2 + 0.25);
                group.add(bl);
            });

            if (marker) {
                const pin = new THREE.Group();
                const cone = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.5, 24), new THREE.MeshStandardMaterial({ color: '#f8fafc', emissive: '#818cf8', emissiveIntensity: 0.9 }));
                cone.rotation.x = Math.PI;
                pin.add(cone);
                const ring = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.04, 12, 48), new THREE.MeshBasicMaterial({ color: '#a5b4fc' }));
                ring.rotation.x = Math.PI / 2;
                ring.position.y = -0.55 - 0.2;
                pin.add(ring);
                const lbl = makeLabel(`คุณอยู่ที่นี่ · ${fmt(calc.netIncome)}`, { size: 0.38, color: '#fff', bg: 'rgba(79,70,229,.92)' });
                lbl.position.y = 0.75;
                pin.add(lbl);
                pin.position.set(marker.x, marker.h + 1.9, 0);
                pin.userData.bob = marker.h + 1.9;
                group.add(pin);
            }
            return { target: new THREE.Vector3(0, 1.8, 0), dist: 15.5 };
        }

        function buildDonut(group, calc) {
            const total = calc.income.totalIncome;
            const exp = Math.min(calc.expenses.total, total);
            const allow = Math.min(calc.allowances, total - exp);
            const tax = calc.tax;
            const rest = Math.max(0, total - exp - allow - calc.tax);
            const segs = [
                { label: 'ค่าใช้จ่าย', value: exp, color: '#f43f5e', h: 0.7 },
                { label: 'ค่าลดหย่อน', value: allow, color: '#10b981', h: 1.0 },
                { label: 'ภาษี', value: tax, color: '#f59e0b', h: 1.9 },
                { label: 'สุทธิหลังภาษี', value: rest, color: '#6366f1', h: 1.3 },
            ].filter((s) => s.value > 0);
            const sum = segs.reduce((s, x) => s + x.value, 0) || 1;
            const R = 4, r = 2.3;
            let a = Math.PI / 2;
            segs.forEach((s, i) => {
                const span = (s.value / sum) * Math.PI * 2;
                const a0 = a, a1 = a + span - (segs.length > 1 ? 0.025 : 0);
                const shape = new THREE.Shape();
                shape.absarc(0, 0, R, a0, a1, false);
                shape.absarc(0, 0, r, a1, a0, true);
                const geo = new THREE.ExtrudeGeometry(shape, { depth: s.h, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 3, curveSegments: 48 });
                geo.rotateX(-Math.PI / 2);
                const col = new THREE.Color(s.color);
                const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: col, emissive: col, emissiveIntensity: 0.22, roughness: 0.3, metalness: 0.25 }));
                // ดันชิ้นออกจากศูนย์กลางเล็กน้อย
                const mid = (a0 + a1) / 2;
                m.position.set(Math.cos(mid) * 0.12, 0, -Math.sin(mid) * 0.12);
                group.add(grow(m, 'y', i * 0.12));
                // วางป้ายเหลื่อมความสูงกัน ชิ้นเล็กๆ ที่อยู่ติดกันจะได้ไม่ทับกัน
                const lr = R + 1.2 + (i % 2) * 0.9;
                const ly = 2.3 + i * 0.95;
                const l1 = makeLabel(`${s.label} ${((s.value / total) * 100).toFixed(1)}%`, { size: 0.38, color: s.color, bg: 'rgba(2,6,23,.82)', weight: 700 });
                l1.position.set(Math.cos(mid) * lr, ly + 0.42, -Math.sin(mid) * lr);
                group.add(l1);
                const l2 = makeLabel(`฿${fmt(s.value)}`, { size: 0.32, color: '#e2e8f0', bg: 'rgba(2,6,23,.6)' });
                l2.position.set(Math.cos(mid) * lr, ly, -Math.sin(mid) * lr);
                group.add(l2);
                const stem = new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(Math.cos(mid) * (R - 0.6), s.h + 0.1, -Math.sin(mid) * (R - 0.6)), new THREE.Vector3(Math.cos(mid) * lr, ly - 0.2, -Math.sin(mid) * lr)]),
                    new THREE.LineBasicMaterial({ color: s.color, transparent: true, opacity: 0.7 })
                );
                group.add(stem);
                a += span;
            });
            const c1 = makeLabel('รายได้รวม', { size: 0.34, color: '#94a3b8', weight: 500 });
            c1.position.set(0, 2.15, 0); group.add(c1);
            const c2 = makeLabel(`฿${fmt(total)}`, { size: 0.55, color: '#fff', weight: 800 });
            c2.position.set(0, 1.6, 0); group.add(c2);
            return { target: new THREE.Vector3(0, 1.6, 0), dist: 16 };
        }

        function buildCoins(group, calc, opt) {
            const bars = [
                { label: 'ภาษีตอนนี้', value: calc.tax, color: '#f43f5e' },
                { label: 'ถ้าลดหย่อนเต็ม', value: opt.bestTax, color: '#10b981' },
                { label: 'หัก ณ ที่จ่ายแล้ว', value: calc.wht, color: '#38bdf8' },
            ];
            const max = Math.max(1, ...bars.map((b) => b.value));
            const coinGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.2, 40);
            const gold = new THREE.MeshStandardMaterial({ color: '#fcd34d', metalness: 0.6, roughness: 0.3, emissive: '#b45309', emissiveIntensity: 0.3 });
            bars.forEach((b, i) => {
                const x = (i - 1) * 3.4;
                const count = b.value > 0 ? Math.max(1, Math.round((b.value / max) * 22)) : 0;
                const stack = new THREE.Group();
                stack.position.x = x;
                for (let k = 0; k < count; k++) {
                    const coin = new THREE.Mesh(coinGeo, gold);
                    coin.position.set((Math.random() - 0.5) * 0.08, 0.1 + k * 0.22, (Math.random() - 0.5) * 0.08);
                    coin.rotation.y = Math.random() * Math.PI;
                    stack.add(coin);
                }
                group.add(grow(stack, 'y', i * 0.15));
                const base = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 1.35, 0.12, 48), new THREE.MeshStandardMaterial({ color: b.color, emissive: b.color, emissiveIntensity: 0.5, roughness: 0.4 }));
                base.position.set(x, -0.06, 0);
                group.add(base);
                const top = 0.3 + count * 0.22;
                const l1 = makeLabel(`฿${fmt(b.value)}`, { size: 0.5, color: '#fff', weight: 800, bg: 'rgba(2,6,23,.78)' });
                l1.position.set(x, top + 0.6, 0); group.add(l1);
                const l2 = makeLabel(b.label, { size: 0.36, color: b.color, weight: 700 });
                l2.position.set(x, -0.45, 1.6); group.add(l2);
            });
            return { target: new THREE.Vector3(0, 2.2, 0), dist: 14 };
        }

        function disposeTree(obj) {
            obj.traverse((o) => {
                if (o.geometry) o.geometry.dispose();
                if (o.material) {
                    const mats = Array.isArray(o.material) ? o.material : [o.material];
                    mats.forEach((m) => { if (m.map) m.map.dispose(); m.dispose(); });
                }
            });
        }

        const Scene3D = ({ mode, calc, opt }) => {
            const mountRef = useRef(null);
            const ctx = useRef(null);
            const [noGL, setNoGL] = useState(false);
            const [fontsReady, setFontsReady] = useState(false);

            useEffect(() => {
                if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setFontsReady(true));
                else setFontsReady(true);
            }, []);

            useEffect(() => {
                const el = mountRef.current;
                if (!window.THREE) { setNoGL(true); return; }
                let renderer;
                try {
                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                } catch (e) { setNoGL(true); return; }
                renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                el.appendChild(renderer.domElement);

                const scene = new THREE.Scene();
                scene.fog = new THREE.Fog(0x020617, 22, 40);
                const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
                scene.add(new THREE.HemisphereLight(0xc7d2fe, 0x0f172a, 1.1));
                const key = new THREE.DirectionalLight(0xffffff, 2.2);
                key.position.set(6, 12, 8);
                scene.add(key);
                const rim = new THREE.PointLight(0x818cf8, 40, 30);
                rim.position.set(-8, 6, -6);
                scene.add(rim);

                const world = new THREE.Group();
                scene.add(world);
                const floor = new THREE.Mesh(new THREE.CircleGeometry(11, 64), new THREE.MeshStandardMaterial({ color: 0x0b1224, roughness: 0.9, transparent: true, opacity: 0.85 }));
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -0.02;
                world.add(floor);
                const grid = new THREE.PolarGridHelper(11, 16, 8, 64, 0x1e293b, 0x1e293b);
                grid.position.y = 0;
                world.add(grid);
                const content = new THREE.Group();
                world.add(content);

                const st = { yaw: -0.35, pitch: 0.42, vYaw: 0, drag: null, idle: 0, target: new THREE.Vector3(0, 1.5, 0), dist: 15, visible: true };
                const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

                const onDown = (e) => { st.drag = { x: e.clientX, y: e.clientY, yaw: st.yaw, pitch: st.pitch }; st.idle = 0; };
                const onMove = (e) => {
                    if (!st.drag) return;
                    const dx = e.clientX - st.drag.x, dy = e.clientY - st.drag.y;
                    if (e.pointerType === 'touch' && Math.abs(dy) > Math.abs(dx) * 1.2 && Math.abs(dx) < 8) return; // ให้เลื่อนหน้าได้
                    st.yaw = st.drag.yaw - dx * 0.008;
                    st.pitch = Math.max(0.08, Math.min(1.25, st.drag.pitch + dy * 0.005));
                };
                const onUp = () => { st.drag = null; };
                const cvs = renderer.domElement;
                cvs.addEventListener('pointerdown', onDown);
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);

                const resize = () => {
                    const w = el.clientWidth, h = el.clientHeight;
                    if (!w || !h) return;
                    renderer.setSize(w, h, false);
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                };
                const ro = new ResizeObserver(resize);
                ro.observe(el);
                resize();
                const io = new IntersectionObserver(([en]) => { st.visible = en.isIntersecting; });
                io.observe(el);

                const clock = new THREE.Clock();
                let raf;
                const loop = () => {
                    raf = requestAnimationFrame(loop);
                    const dt = Math.min(clock.getDelta(), 0.05);
                    if (!st.visible || document.hidden) return;
                    const time = clock.elapsedTime;
                    if (!st.drag) { st.idle += dt; if (!reduce && st.idle > 2.5) st.yaw += dt * 0.12; }
                    // ระยะกล้องปรับตามสัดส่วนจอ ให้มือถือเห็นครบ
                    const dist = st.dist * Math.max(1, 1.6 / camera.aspect);
                    camera.position.set(
                        st.target.x + Math.sin(st.yaw) * Math.cos(st.pitch) * dist,
                        st.target.y + Math.sin(st.pitch) * dist,
                        st.target.z + Math.cos(st.yaw) * Math.cos(st.pitch) * dist
                    );
                    camera.lookAt(st.target);
                    content.traverse((o) => {
                        const g = o.userData.grow;
                        if (g && g.t < 1) {
                            g.t = reduce ? 1 : g.t + dt * 1.6;
                            const k = Math.max(0, Math.min(1, g.t));
                            o.scale[g.axis] = Math.max(0.001, 1 - Math.pow(1 - k, 3));
                        }
                        if (o.userData.bob !== undefined) o.position.y = o.userData.bob + (reduce ? 0 : Math.sin(time * 2.4) * 0.15);
                    });
                    renderer.render(scene, camera);
                };
                loop();

                ctx.current = { content, st };
                return () => {
                    cancelAnimationFrame(raf);
                    ro.disconnect(); io.disconnect();
                    cvs.removeEventListener('pointerdown', onDown);
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    disposeTree(scene);
                    renderer.dispose();
                    el.removeChild(cvs);
                    ctx.current = null;
                };
            }, []);

            useEffect(() => {
                const c = ctx.current;
                if (!c) return;
                const prev = c.content.children.slice();

                                )}
                                <button onClick={() => setModal('breakdown')} className="mt-4 w-full py-3 rounded-xl bg-white text-slate-900 font-bold text-sm hover:bg-slate-200 transition-colors flex items-center justify-center gap-2">
                                    <IconDoc className="w-4 h-4" /> ดูรายละเอียดการคำนวณทีละขั้น
                                </button>
                            </div>
                        </aside>
                    </div>

                    {/* Saved plans & comparison */}
                    <section className="glass rounded-3xl p-5 sm:p-7">
                        <h2 className="font-bold text-white text-lg flex items-center gap-2 mb-4"><IconSave className="w-5 h-5 text-indigo-300" /> บันทึกและเปรียบเทียบแผน <span className="text-xs text-slate-500 font-medium">(เก็บในเครื่องนี้)</span></h2>
                        <form onSubmit={savePlan} className="flex flex-col sm:flex-row gap-3">
                            <input type="text" value={planName} onChange={(e) => setPlanName(e.target.value)} placeholder="ตั้งชื่อแผน เช่น 'ซื้อ RMF เพิ่ม 50k'" className="field flex-1 rounded-xl py-3 px-4 font-semibold" />
                            <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-bold transition-colors">บันทึกแผน</button>
                        </form>
                        {planCalcs.length > 0 && (
                            <div className="mt-5 overflow-x-auto -mx-5 sm:mx-0">
                                <table className="w-full min-w-[640px] text-sm">
                                    <thead>
                                        <tr className="text-left text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-800">
                                            <th className="py-2.5 px-5 sm:px-3">แผน</th><th className="py-2.5 px-3">ปีภาษี</th><th className="py-2.5 px-3 text-right">รายได้</th><th className="py-2.5 px-3 text-right">ภาษี</th><th className="py-2.5 px-3 text-right">อัตราเฉลี่ย</th><th className="py-2.5 px-3 text-right">คืน / จ่ายเพิ่ม</th><th className="py-2.5 px-3"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {(() => {
                                            const minTax = Math.min(...planCalcs.map((x) => x.c.tax));
                                            return planCalcs.map(({ plan, c }) => (
                                                <tr key={plan.id} className="border-b border-slate-800/60 hover:bg-slate-800/30">
                                                    <td className="py-3 px-5 sm:px-3 font-semibold text-white max-w-[200px] truncate">{plan.name} {c.tax === minTax && planCalcs.length > 1 && <Pill tone="emerald">ภาษีต่ำสุด</Pill>}</td>
                                                    <td className="py-3 px-3 text-slate-400">{c.year}</td>
                                                    <td className="py-3 px-3 text-right tabular-nums">{fmt(c.income.totalIncome)}</td>
                                                    <td className="py-3 px-3 text-right tabular-nums font-bold text-white">{fmt(c.tax)}</td>
                                                    <td className="py-3 px-3 text-right tabular-nums">{pct(c.effectiveRate)}</td>
                                                    <td className={`py-3 px-3 text-right tabular-nums font-bold ${c.isRefund ? 'text-emerald-300' : 'text-rose-300'}`}>{c.isRefund ? '+' : '-'}{fmt(Math.abs(c.balance))}</td>
                                                    <td className="py-3 px-3 text-right whitespace-nowrap">
                                                        <button onClick={() => loadPlan(plan)} className="text-xs font-bold text-indigo-300 hover:text-white bg-indigo-500/15 px-3 py-1.5 rounded-lg mr-1">เรียกดู</button>
                                                        <button onClick={() => deletePlan(plan)} aria-label={`ลบแผน ${plan.name}`} className="text-slate-500 hover:text-rose-300 p-1.5 align-middle"><IconTrash className="w-4 h-4" /></button>
                                                    </td>
                                                </tr>
                                            ));
                                        })()}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </section>

                    {/* Knowledge */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-5 sm:gap-6">
                        <section className="glass rounded-3xl p-5 sm:p-6">
                            <h3 className="font-bold text-white flex items-center gap-2 mb-4"><IconCalendar className="w-5 h-5 text-sky-300" /> ปฏิทินภาษี</h3>
                            <ol className="space-y-4 relative border-l border-slate-700 ml-2">
                                {CALENDAR.map((c) => (
                                    <li key={c.when} className="pl-4 relative">
                                        <span className="absolute -left-[5px] top-1.5 w-2.5 h-2.5 rounded-full bg-sky-400" />
                                        <div className="text-[11px] font-bold text-sky-300">{c.when}</div>
                                        <div className="text-sm font-semibold text-white">{c.what}</div>
                                        <div className="text-xs text-slate-400">{c.sub}</div>
                                    </li>
                                ))}
                            </ol>
                        </section>
                        <section className="glass rounded-3xl p-5 sm:p-6">
                            <h3 className="font-bold text-white flex items-center gap-2 mb-4"><IconAlert className="w-5 h-5 text-amber-300" /> เงื่อนไขที่ต้องรู้ก่อนซื้อ</h3>
                            <ul className="space-y-3">
                                {RULES_INFO.map((r) => (
                                    <li key={r.name} className="text-sm"><b className="text-amber-200">{r.name}</b> <span className="text-slate-400">— {r.text}</span></li>
                                ))}
                            </ul>
                        </section>
                        <section className="glass rounded-3xl p-5 sm:p-6">
                            <h3 className="font-bold text-white flex items-center gap-2 mb-4"><IconCheck className="w-5 h-5 text-emerald-300" /> เอกสารที่ต้องเตรียม</h3>
                            <ul className="space-y-2.5">
                                {DOCS.map((d) => (
                                    <li key={d} className="flex gap-2.5 text-sm text-slate-300"><span className="mt-1.5 w-1.5 h-1.5 rounded-full bg-emerald-400 shrink-0" />{d}</li>
                                ))}
                            </ul>
                        </section>
                    </div>

                    <p className="text-center text-[11.5px] text-slate-500 leading-relaxed max-w-3xl mx-auto">
                        เครื่องมือนี้ใช้เพื่อการวางแผนเบื้องต้น อ้างอิงหลักเกณฑ์กรมสรรพากรตามข้อมูลล่าสุดที่รวบรวมได้ — เพดานบางรายการ (เช่น มาตรการกระตุ้นเศรษฐกิจ, ThaiESGX) เปลี่ยนตามประกาศแต่ละปี ควรตรวจสอบกับ rd.go.th ก่อนยื่นจริง
                        · ข้อมูลทั้งหมดเก็บอยู่ในเบราว์เซอร์ของคุณเท่านั้น
                    </p>

                    {/* ===== Modals ===== */}
                    {modal === 'clear' && (
                        <Modal onClose={() => setModal(null)}>
                            <h3 className="text-xl font-bold text-white text-center mb-2">ล้างข้อมูลในฟอร์ม?</h3>
                            <p className="text-sm text-slate-400 text-center mb-6">แผนที่บันทึกไว้จะไม่หายไป</p>
                            <div className="flex gap-3">
                                <button onClick={() => setModal(null)} className="flex-1 py-3 rounded-xl bg-slate-800 text-slate-200 font-bold">ยกเลิก</button>
                                <button onClick={clearForm} className="flex-1 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold">ล้างข้อมูล</button>
                            </div>
                        </Modal>
                    )}
                    {modal && modal.preset && (
                        <Modal onClose={() => setModal(null)}>
                            <h3 className="text-xl font-bold text-white text-center mb-2">โหลด {PRESETS[modal.preset].label}?</h3>
                            <p className="text-sm text-slate-400 text-center mb-6">ข้อมูลในฟอร์มตอนนี้จะถูกแทนที่ทั้งหมด</p>
                            <div className="flex gap-3">
                                <button onClick={() => setModal(null)} className="flex-1 py-3 rounded-xl bg-slate-800 text-slate-200 font-bold">ยกเลิก</button>
                                <button onClick={() => applyPreset(modal.preset)} className="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold">โหลดเลย</button>
                            </div>
                        </Modal>
                    )}
                    {modal === 'breakdown' && (
                        <Modal wide onClose={() => setModal(null)}>
                            <button onClick={() => setModal(null)} aria-label="ปิด" className="absolute top-4 right-4 p-2 rounded-full bg-slate-800 text-slate-400 hover:text-white"><IconX className="w-5 h-5" /></button>
                            <h3 className="text-xl sm:text-2xl font-bold text-white mb-6 pr-10">รายละเอียดการคำนวณ · {R.label}</h3>
                            <div className="space-y-4 text-sm">
                                <div className="bg-slate-950/50 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-2">
                                    <div className="flex justify-between font-bold text-white"><span>1. เงินได้พึงประเมิน</span><span>{fmt(calc.income.totalIncome)}</span></div>
                                    {[['40(1) เงินเดือน+โบนัส', calc.income.inc401], ['40(2) ฟรีแลนซ์', calc.income.inc402], ['40(5) ค่าเช่า', calc.income.inc405], ['40(8) ธุรกิจ', calc.income.inc408]].filter(([, v]) => v > 0).map(([l, v]) => (
                                        <div key={l} className="flex justify-between text-slate-400 pl-3"><span>{l}</span><span>{fmt(v)}</span></div>
                                    ))}
                                    <div className="flex justify-between font-bold text-rose-300 pt-2"><span>2. หักค่าใช้จ่าย</span><span>-{fmt(calc.expenses.total)}</span></div>
                                    {[['40(1)+40(2) เหมา 50% (≤100,000)', calc.expenses.exp401_402], ['40(5) เหมา 30%', calc.expenses.exp405], ['40(8) เหมา 60%', calc.expenses.exp408]].filter(([, v]) => v > 0).map(([l, v]) => (
                                        <div key={l} className="flex justify-between text-slate-400 pl-3"><span>{l}</span><span>-{fmt(v)}</span></div>
                                    ))}
                                </div>
                                <div className="bg-slate-950/50 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-2">
                                    <div className="font-bold text-white">3. หักค่าลดหย่อน</div>
                                    {calc.allowanceItems.map((i) => (
                                        <div key={i.key} className="flex justify-between text-slate-400 pl-3"><span>{i.label}</span><span className="text-emerald-300">-{fmt(i.amount)}</span></div>
                                    ))}
                                    <div className="flex justify-between font-bold text-emerald-300 border-t border-slate-800 pt-2"><span>รวมค่าลดหย่อน</span><span>-{fmt(calc.allowances)}</span></div>
                                </div>
                                <div className="bg-indigo-500/10 border border-indigo-400/20 rounded-2xl p-4 sm:p-5 flex justify-between items-center">
                                    <span className="font-bold text-indigo-100">4. เงินได้สุทธิ</span>
                                    <span className="text-2xl font-black text-indigo-200">{fmt(calc.netIncome)}</span>
                                </div>
                                <div className="bg-slate-950/50 border border-slate-800 rounded-2xl p-4 sm:p-5">
                                    <div className="font-bold text-white mb-3">5. คำนวณตามขั้นบันได</div>
                                    <div className="space-y-2">
                                        {calc.brackets.map((b, i) => {
                                            const span = Number.isFinite(b.max) ? b.max - b.min : 5000000;
                                            return (
                                                <div key={i} className={`grid grid-cols-[3rem_1fr_6rem] gap-3 items-center ${b.taxable > 0 ? '' : 'opacity-35'}`}>
                                                    <span className="font-black" style={{ color: RATE_COLORS[i] }}>{b.rate}%</span>
                                                    <div>
                                                        <div className="text-[11px] text-slate-500">{fmt(b.min)} – {Number.isFinite(b.max) ? fmt(b.max) : 'ขึ้นไป'}</div>
                                                        <div className="h-2 rounded-full bg-slate-800 overflow-hidden mt-1"><div className="h-full rounded-full" style={{ width: `${Math.min(100, (b.taxable / span) * 100)}%`, background: RATE_COLORS[i] }} /></div>
                                                    </div>
                                                    <span className="text-right font-bold text-white tabular-nums">{fmt(b.tax)}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 rounded-2xl p-5 space-y-2">
                                    {calc.income.otherIncome >= 120000 && (
                                        <div className={`text-xs ${calc.minTaxApplied ? 'text-amber-300' : 'text-slate-400'}`}>
                                            เทียบภาษีขั้นต่ำ ม.48(2): 0.5% x {fmt(calc.income.otherIncome)} = {fmt(calc.minimumTax)} {calc.minTaxApplied ? '→ สูงกว่าวิธีขั้นบันได ใช้ยอดนี้' : calc.minimumTax <= 5000 ? '→ ไม่เกิน 5,000 ได้รับยกเว้น' : '→ ต่ำกว่าวิธีขั้นบันได ใช้วิธีปกติ'}
                                        </div>
                                    )}
                                    <div className="flex justify-between text-slate-300 font-semibold"><span>ภาษีที่ต้องเสีย</span><span>{fmt(calc.tax)}</span></div>
                                    <div className="flex justify-between text-sky-300 font-semibold"><span>หัก ภาษี ณ ที่จ่าย</span><span>-{fmt(calc.wht)}</span></div>
                                    <div className="flex justify-between items-center border-t border-slate-700 pt-3">
                                        <span className="font-bold text-white">{calc.isRefund ? '🎉 ได้เงินคืน' : '⚠️ ต้องชำระเพิ่ม'}</span>
                                        <span className={`text-3xl font-black ${calc.isRefund ? 'text-emerald-300' : 'text-amber-300'}`}>{fmt(Math.abs(calc.balance))}</span>
                                    </div>
                                </div>
                            </div>
                        </Modal>
                    )}

                    {/* Mobile bottom bar */}
                    <div className="xl:hidden fixed bottom-3 left-3 right-3 z-40">
                        <div className="glass !bg-slate-900/90 rounded-2xl p-3.5 flex items-center justify-between">
                            <div>
                                <div className="text-[11px] text-slate-400 font-semibold">{heroLabel}</div>
                                <div className={`text-xl font-black tabular-nums ${tone === 'refund' ? 'text-emerald-300' : tone === 'pay' ? 'text-rose-300' : 'text-white'}`}>{fmt(Math.abs(calc.balance))} <span className="text-xs text-slate-500">บาท</span></div>
                            </div>
                            <button onClick={() => document.getElementById('results').scrollIntoView({ behavior: 'smooth' })} className="bg-white text-slate-900 px-4 py-2.5 rounded-xl text-sm font-bold">ดูผล 3D</button>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
